name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  OBFUSCATE: 'true'
  YTDLP_VERSION: '2026.06.09'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ''
            shazam_asset: shazam-cli-linux-amd64
            ffmpeg_package: '@ffmpeg-installer/linux-x64'
            ffprobe_package: '@ffprobe-installer/linux-x64'
            ffmpeg_bin: ffmpeg
            ffprobe_bin: ffprobe
            ytdlp_asset: yt-dlp_linux

          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ''
            shazam_asset: shazam-cli-linux-arm64
            ffmpeg_package: '@ffmpeg-installer/linux-arm64'
            ffprobe_package: '@ffprobe-installer/linux-arm64'
            ffmpeg_bin: ffmpeg
            ffprobe_bin: ffprobe
            ytdlp_asset: yt-dlp_linux_aarch64

          - name: macos-amd64
            goos: darwin
            goarch: amd64
            ext: ''
            shazam_asset: shazam-cli-macos-amd64
            ffmpeg_package: '@ffmpeg-installer/darwin-x64'
            ffprobe_package: '@ffprobe-installer/darwin-x64'
            ffmpeg_bin: ffmpeg
            ffprobe_bin: ffprobe
            ytdlp_asset: yt-dlp_macos

          - name: macos-arm64
            goos: darwin
            goarch: arm64
            ext: ''
            shazam_asset: shazam-cli-macos-arm64
            ffmpeg_package: '@ffmpeg-installer/darwin-arm64'
            ffprobe_package: '@ffprobe-installer/darwin-arm64'
            ffmpeg_bin: ffmpeg
            ffprobe_bin: ffprobe
            ytdlp_asset: yt-dlp_macos

          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
            shazam_asset: shazam-cli-windows-amd64.exe
            ffmpeg_package: '@ffmpeg-installer/win32-x64'
            ffprobe_package: '@ffprobe-installer/win32-x64'
            ffmpeg_bin: ffmpeg.exe
            ffprobe_bin: ffprobe.exe
            ytdlp_asset: yt-dlp.exe

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare embedded dependency directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf utils/bin
          mkdir -p utils/bin

      - name: Download Shazam CLI from release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/shazam-download
          gh release download shazam-cli-latest \
            --pattern "${{ matrix.shazam_asset }}" \
            --dir /tmp/shazam-download
          cp "/tmp/shazam-download/${{ matrix.shazam_asset }}" utils/bin/shazam-cli
          chmod +x utils/bin/shazam-cli || true

      - name: Download FFmpeg and FFprobe via npm packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ffmpeg-download /tmp/ffprobe-download

          # FFmpeg
          npm pack ${{ matrix.ffmpeg_package }} --pack-destination /tmp/ffmpeg-download >/dev/null
          ffmpeg_tarball=$(find /tmp/ffmpeg-download -name '*.tgz' -print -quit)
          tar -xzf "$ffmpeg_tarball" -C /tmp/ffmpeg-download
          ffmpeg_dir=$(find /tmp/ffmpeg-download -maxdepth 1 -type d -name 'package*' -print -quit)
          cp "$ffmpeg_dir/${{ matrix.ffmpeg_bin }}" utils/bin/ffmpeg
          chmod +x utils/bin/ffmpeg || true

          # FFprobe
          npm pack ${{ matrix.ffprobe_package }} --pack-destination /tmp/ffprobe-download >/dev/null
          ffprobe_tarball=$(find /tmp/ffprobe-download -name '*.tgz' -print -quit)
          tar -xzf "$ffprobe_tarball" -C /tmp/ffprobe-download
          ffprobe_dir=$(find /tmp/ffprobe-download -maxdepth 1 -type d -name 'package*' -print -quit)
          cp "$ffprobe_dir/${{ matrix.ffprobe_bin }}" utils/bin/ffprobe
          chmod +x utils/bin/ffprobe || true

      - name: Download pinned yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.ytdlp_asset }}" in
            yt-dlp.exe) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp.exe" ;;
            yt-dlp_linux) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux" ;;
            yt-dlp_linux_aarch64) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux_aarch64" ;;
            yt-dlp_macos) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_macos" ;;
            *) echo "Unsupported yt-dlp asset"; exit 1 ;;
          esac
          curl -fL --retry 3 "$url" -o utils/bin/yt-dlp
          chmod +x utils/bin/yt-dlp || true

      - name: Verify embedded dependencies
        shell: bash
        run: |
          set -euo pipefail
          test -s utils/bin/ffmpeg
          test -s utils/bin/ffprobe
          test -s utils/bin/yt-dlp
          test -s utils/bin/shazam-cli

      - name: Updating Whatsmeow dependencies
        run: | 
          go mod edit -droprequire=github.com/ncruces/go-strftime
          go get modernc.org/sqlite@latest
          go get go.mau.fi/whatsmeow@latest
          
      - name: Resolve Go dependencies
        run: go mod tidy

      - name: Install Garble
        if: env.OBFUSCATE == 'true'
        run: go install mvdan.cc/garble@latest

      - name: Build Whatbot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=''
          if [ "${GOOS}" = "windows" ]; then suffix='.exe'; fi
          output="dist/whatbot-${{ matrix.name }}${suffix}"
          if [ "${OBFUSCATE}" = "true" ]; then
            garble -tiny -literals -seed=random build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          else
            go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          fi

      - name: Smoke test embedded tools
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.goos }}/${{ matrix.goarch }}" in
            linux/amd64)
              utils/bin/ffmpeg -version | head -n1
              utils/bin/ffprobe -version | head -n1
              utils/bin/yt-dlp --version
              output="$(utils/bin/shazam-cli /definitely/missing/file.mp3 || true)"
              echo "$output"
              grep -F 'File not found' <<< "$output"
              ;;
            *) echo 'Cross-architecture build: embedded files verified; native execution requires the matching target runner.' ;;
          esac

      - name: Smoke test Whatbot binary
        shell: bash
        run: |
          set -euo pipefail
          test -s "dist/whatbot-${{ matrix.name }}${{ matrix.ext }}"
          file "dist/whatbot-${{ matrix.name }}${{ matrix.ext }}"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "whatbot-${{ matrix.name }}.tar.gz" -C dist "$(basename dist/whatbot-${{ matrix.name }}${{ matrix.ext }})"

      - uses: actions/upload-artifact@v4
        with:
          name: whatbot-${{ matrix.name }}
          path: whatbot-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: whatbot-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            tag="v$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      - name: Create tag for manual release
        if: github.ref_type != 'tag'
        uses: EndBug/latest-tag@latest
        with:
          ref: ${{ steps.release_tag.outputs.tag }}

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
