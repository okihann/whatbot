name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  OBFUSCATE: 'true'
  YTDLP_VERSION: '2026.06.09'

jobs:
  shazam:
    name: Build Shazam CLI (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-amd64, runner: ubuntu-latest, target: node22-linux-x64}
          - {name: linux-arm64, runner: ubuntu-24.04-arm, target: node22-linux-arm64}
          - {name: windows-amd64, runner: windows-latest, target: node22-win-x64}
          - {name: windows-arm64, runner: windows-11-arm, target: node22-win-arm64}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Create Shazam CLI project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shazam-cli
          cd shazam-cli
          npm init -y
          npm install --save-exact node-shazam@latest
          cat > index.js <<'EOF'
          const { Shazam } = require('node-shazam');
          const fs = require('fs');
          const shazam = new Shazam();

          async function run() {
            const audioFile = process.argv[2];
            if (!audioFile || !fs.existsSync(audioFile)) {
              console.log(JSON.stringify({success:false,error:'File not found'}));
              process.exitCode = 1;
              return;
            }
            try {
              const result = await shazam.recognise(audioFile);
              if (result && result.track) {
                console.log(JSON.stringify({
                  success:true,
                  title:result.track.title,
                  artist:result.track.subtitle,
                  url:result.track.url
                }));
              } else {
                console.log(JSON.stringify({success:false,error:'No match found'}));
              }
            } catch (e) {
              console.log(JSON.stringify({success:false,error:e?.message || String(e)}));
              process.exitCode = 1;
            }
          }

          run();
          EOF

      - name: Build native Shazam binary
        id: pkg
        uses: yao-pkg/pkg-action@v1
        with:
          targets: ${{ matrix.target }}
          compress: none
          checksum: sha256
          config-inline: |
            {
              "bin": "index.js",
              "compress": "Brotli",
              "noBytecode": true,
              "publicPackages": "*"
            }

      - name: Upload Shazam binary
        uses: actions/upload-artifact@v4
        with:
          name: shazam-cli-${{ matrix.name }}
          path: ${{ join(fromJson(steps.pkg.outputs.binaries), '\n') }}
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: shazam
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-amd64, goos: linux, goarch: amd64, ffmpeg_asset: ffmpeg-master-latest-linux64-gpl.tar.xz, ytdlp_asset: yt-dlp_linux, shazam_artifact: shazam-cli-linux-amd64, ext: ''}
          - {name: linux-arm64, goos: linux, goarch: arm64, ffmpeg_asset: ffmpeg-master-latest-linuxarm64-lgpl-shared.tar.xz, ytdlp_asset: yt-dlp_linux_aarch64, shazam_artifact: shazam-cli-linux-arm64, ext: ''}
          - {name: windows-amd64, goos: windows, goarch: amd64, ffmpeg_asset: ffmpeg-master-latest-win64-gpl.zip, ytdlp_asset: yt-dlp.exe, shazam_artifact: shazam-cli-windows-amd64, ext: '.exe'}
          - {name: windows-arm64, goos: windows, goarch: arm64, ffmpeg_asset: ffmpeg-master-latest-winarm64-gpl.zip, ytdlp_asset: yt-dlp.exe, shazam_artifact: shazam-cli-windows-arm64, ext: '.exe'}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare embedded dependency directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf utils/bin
          mkdir -p utils/bin

      - name: Download native Shazam CLI
        uses: actions/download-artifact@v5
        with:
          name: ${{ matrix.shazam_artifact }}
          path: utils/bin

      - name: Normalize Shazam CLI name
        shell: bash
        run: |
          set -euo pipefail
          shazam_path="$(find utils/bin -maxdepth 1 -type f | head -n1)"
          test -n "$shazam_path"
          mv "$shazam_path" utils/bin/shazam-cli
          chmod +x utils/bin/shazam-cli || true

      - name: Download FFmpeg and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.ffmpeg_asset }}"
          echo "Downloading $url"
          curl -fL --retry 3 "$url" -o /tmp/ffmpeg-package
          mkdir -p /tmp/ffmpeg-extract
          case "${{ matrix.ffmpeg_asset }}" in
            *.zip) unzip -q /tmp/ffmpeg-package -d /tmp/ffmpeg-extract ;;
            *.tar.xz) tar -xJf /tmp/ffmpeg-package -C /tmp/ffmpeg-extract ;;
            *) echo "Unsupported FFmpeg archive"; exit 1 ;;
          esac
          ffmpeg_path="$(find /tmp/ffmpeg-extract -type f \( -name 'ffmpeg' -o -name 'ffmpeg.exe' \) | head -n1)"
          ffprobe_path="$(find /tmp/ffmpeg-extract -type f \( -name 'ffprobe' -o -name 'ffprobe.exe' \) | head -n1)"
          test -n "$ffmpeg_path"
          test -n "$ffprobe_path"
          cp "$ffmpeg_path" utils/bin/ffmpeg
          cp "$ffprobe_path" utils/bin/ffprobe
          chmod +x utils/bin/ffmpeg utils/bin/ffprobe || true

      - name: Download pinned yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.ytdlp_asset }}" in
            yt-dlp.exe) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp.exe" ;;
            yt-dlp_linux) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux" ;;
            yt-dlp_linux_aarch64) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux_aarch64" ;;
            *) echo "Unsupported yt-dlp asset"; exit 1 ;;
          esac
          curl -fL --retry 3 "$url" -o utils/bin/yt-dlp
          chmod +x utils/bin/yt-dlp || true

      - name: Verify embedded dependencies
        shell: bash
        run: |
          set -euo pipefail
          ls -lh utils/bin
          test -s utils/bin/ffmpeg
          test -s utils/bin/ffprobe
          test -s utils/bin/yt-dlp
          test -s utils/bin/shazam-cli

      - name: Resolve Go dependencies
        run: go mod tidy

      - name: Install Garble
        if: env.OBFUSCATE == 'true'
        run: go install mvdan.cc/garble@latest

      - name: Build Whatbot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=''
          if [ "${GOOS}" = "windows" ]; then suffix='.exe'; fi
          output="dist/whatbot-${{ matrix.name }}${suffix}"
          if [ "${OBFUSCATE}" = "true" ]; then
            garble -tiny -literals -seed=random build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          else
            go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "whatbot-${{ matrix.name }}.tar.gz" -C dist "$(basename dist/whatbot-${{ matrix.name }}${{ matrix.ext }})"

      - uses: actions/upload-artifact@v4
        with:
          name: whatbot-${{ matrix.name }}
          path: whatbot-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: whatbot-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
