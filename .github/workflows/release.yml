name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  OBFUSCATE: 'true'

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-amd64, goos: linux, goarch: amd64, libc: glibc}
          - {name: linux-arm64, goos: linux, goarch: arm64, libc: glibc}
          - {name: linux-amd64-musl, goos: linux, goarch: amd64, libc: musl}
          - {name: linux-arm64-musl, goos: linux, goarch: arm64, libc: musl}
          - {name: linux-386, goos: linux, goarch: 386, libc: glibc}
          - {name: linux-arm, goos: linux, goarch: arm, libc: glibc}
          - {name: windows-amd64, goos: windows, goarch: amd64, libc: none}
          - {name: windows-386, goos: windows, goarch: 386, libc: none}
          - {name: windows-arm64, goos: windows, goarch: arm64, libc: none}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: go mod tidy

      - name: Install Garble
        if: env.OBFUSCATE == 'true'
        run: go install mvdan.cc/garble@latest

      - name: Install musl toolchain
        if: matrix.libc == 'musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.libc == 'musl' && '1' || '0' }}
          CC: ${{ matrix.libc == 'musl' && 'musl-gcc' || '' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=''
          if [ "${GOOS}" = "windows" ]; then suffix='.exe'; fi
          output="dist/whatbot-${{ matrix.name }}${suffix}"
          if [ "${OBFUSCATE}" = "true" ]; then
            garble -tiny -literals -seed=random build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          else
            go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          tar -czf "../whatbot-${{ matrix.name }}.tar.gz" whatbot-${{ matrix.name }}*

      - uses: actions/upload-artifact@v4
        with:
          name: whatbot-${{ matrix.name }}
          path: whatbot-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: whatbot-*
          merge-multiple: true

      - name: Generate checksums
        run: sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
