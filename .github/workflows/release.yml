name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GO_VERSION: '1.26.x'
  OBFUSCATE: 'true'
  YTDLP_VERSION: '2026.06.09'
  SHAZAM_NODE_VERSION: '18.20.8'

jobs:
  shazam:
    name: Build Shazam CLI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Initialize and install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm init -y
          npm install --save-exact node-shazam@latest
          npm install --global @yao-pkg/pkg@6.22.0

      - name: Generate bridge code
        shell: bash
        run: |
          set -euo pipefail
          cat > index.js <<'EOF'
          const { Shazam } = require('node-shazam');
          const fs = require('fs');
          const shazam = new Shazam();
          async function run() {
            const audioFile = process.argv[2];
            if (!audioFile || !fs.existsSync(audioFile)) {
              console.log(JSON.stringify({success:false,error:'File not found'}));
              process.exitCode = 1;
              return;
            }
            try {
              const result = await shazam.recognise(audioFile);
              if (result && result.track) {
                console.log(JSON.stringify({success:true,title:result.track.title,artist:result.track.subtitle,url:result.track.url}));
              } else {
                console.log(JSON.stringify({success:false,error:'No match found'}));
              }
            } catch (e) {
              console.log(JSON.stringify({success:false,error:e?.message || String(e)}));
              process.exitCode = 1;
            }
          }
          run();
          EOF

      - name: Verify pkg has the prebuilt Node base binary
        shell: bash
        run: |
          set -euo pipefail
          cache_dir="${PKG_CACHE_PATH:-$HOME/.pkg-cache}"
          mkdir -p "$cache_dir"
          # pkg 6.22.0 uses Node 18.20.8 for node18-linux-x64.
          # Fail fast instead of falling back to compiling Node from source.
          url="https://github.com/yao-pkg/pkg-fetch/releases/download/v3.6/node-v${SHAZAM_NODE_VERSION}-linux-x64"
          echo "Checking $url"
          curl -fsSI "$url" >/dev/null

      - name: Compile standalone Linux amd64 Shazam CLI
        shell: bash
        run: |
          set -euo pipefail
          pkg index.js --target node18-linux-x64 --output shazam-cli
          test -s shazam-cli

      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./shazam-cli /definitely/missing/file.mp3 | grep -F 'File not found'

      - name: Generate checksum
        shell: bash
        run: sha256sum shazam-cli > shazam-cli.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: shazam-cli-linux-amd64
          path: |
            shazam-cli
            shazam-cli.sha256
          if-no-files-found: error

  build:
    name: Build ${{ matrix.name }}
    needs: shazam
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-amd64, goos: linux, goarch: amd64, ffmpeg_asset: ffmpeg-master-latest-linux64-gpl.tar.xz, ytdlp_asset: yt-dlp_linux, ext: ''}
          - {name: linux-arm64, goos: linux, goarch: arm64, ffmpeg_asset: ffmpeg-master-latest-linuxarm64-lgpl-shared.tar.xz, ytdlp_asset: yt-dlp_linux_aarch64, ext: ''}
          - {name: windows-amd64, goos: windows, goarch: amd64, ffmpeg_asset: ffmpeg-master-latest-win64-gpl.zip, ytdlp_asset: yt-dlp.exe, ext: '.exe'}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare embedded dependency directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf utils/bin
          mkdir -p utils/bin

      - name: Download Shazam CLI
        uses: actions/download-artifact@v5
        with:
          name: shazam-cli-linux-amd64
          path: /tmp/shazam

      - name: Install Shazam CLI
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/shazam/shazam-cli utils/bin/shazam-cli
          chmod +x utils/bin/shazam-cli

      - name: Download FFmpeg and FFprobe
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/${{ matrix.ffmpeg_asset }}"
          echo "Downloading $url"
          curl -fL --retry 3 "$url" -o /tmp/ffmpeg-package
          mkdir -p /tmp/ffmpeg-extract
          case "${{ matrix.ffmpeg_asset }}" in
            *.zip) unzip -q /tmp/ffmpeg-package -d /tmp/ffmpeg-extract ;;
            *.tar.xz) tar -xJf /tmp/ffmpeg-package -C /tmp/ffmpeg-extract ;;
            *) echo "Unsupported FFmpeg archive"; exit 1 ;;
          esac
          ffmpeg_path="$(find /tmp/ffmpeg-extract -type f \( -name 'ffmpeg' -o -name 'ffmpeg.exe' \) | head -n1)"
          ffprobe_path="$(find /tmp/ffmpeg-extract -type f \( -name 'ffprobe' -o -name 'ffprobe.exe' \) | head -n1)"
          test -n "$ffmpeg_path"
          test -n "$ffprobe_path"
          cp "$ffmpeg_path" utils/bin/ffmpeg
          cp "$ffprobe_path" utils/bin/ffprobe
          chmod +x utils/bin/ffmpeg utils/bin/ffprobe || true

      - name: Download pinned yt-dlp
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.ytdlp_asset }}" in
            yt-dlp.exe) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp.exe" ;;
            yt-dlp_linux) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux" ;;
            yt-dlp_linux_aarch64) url="https://github.com/yt-dlp/yt-dlp/releases/download/${YTDLP_VERSION}/yt-dlp_linux_aarch64" ;;
            *) echo "Unsupported yt-dlp asset"; exit 1 ;;
          esac
          curl -fL --retry 3 "$url" -o utils/bin/yt-dlp
          chmod +x utils/bin/yt-dlp || true

      - name: Verify embedded dependencies
        shell: bash
        run: |
          set -euo pipefail
          ls -lh utils/bin
          test -s utils/bin/ffmpeg
          test -s utils/bin/ffprobe
          test -s utils/bin/yt-dlp
          test -s utils/bin/shazam-cli

      - name: Resolve Go dependencies
        run: go mod tidy

      - name: Install Garble
        if: env.OBFUSCATE == 'true'
        run: go install mvdan.cc/garble@latest

      - name: Build Whatbot
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          suffix=''
          if [ "${GOOS}" = "windows" ]; then suffix='.exe'; fi
          output="dist/whatbot-${{ matrix.name }}${suffix}"
          if [ "${OBFUSCATE}" = "true" ]; then
            garble -tiny -literals -seed=random build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          else
            go build -trimpath -buildvcs=false -ldflags='-s -w' -o "$output" .
          fi

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "whatbot-${{ matrix.name }}.tar.gz" -C dist "$(basename dist/whatbot-${{ matrix.name }}${{ matrix.ext }})"

      - uses: actions/upload-artifact@v4
        with:
          name: whatbot-${{ matrix.name }}
          path: whatbot-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: whatbot-*
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum artifacts/*.tar.gz > artifacts/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
